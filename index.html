<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitemap | Posters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d1117;
      --text-primary: #e6edf3;
      --text-secondary: #7d8590;
      --card-bg: rgba(22, 27, 34, 0.6);
      --card-border: rgba(48, 54, 61, 0.5);
      --card-hover: rgba(33, 38, 45, 0.8);
      --accent-glow: rgba(88, 166, 255, 0.15);
      --accent-color: #58a6ff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at top right, var(--accent-glow) 0%, transparent 40%),
        radial-gradient(circle at bottom left, var(--accent-glow) 0%, transparent 40%);
    }

    .container {
      max-width: 800px;
      width: 90%;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 4rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem 0;
      background: linear-gradient(135deg, #fff 0%, #a4b1cd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-secondary);
      font-size: 1.1rem;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: rgba(88, 166, 255, 0.3);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2),
        0 0 20px rgba(88, 166, 255, 0.05);
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 500;
      margin: 0;
      color: var(--text-primary);
      transition: color 0.3s ease;
    }

    .card:hover .card-title {
      color: var(--accent-color);
    }

    .card-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      flex-grow: 1;
    }

    .arrow-icon {
      width: 20px;
      height: 20px;
      stroke: var(--text-secondary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      transition: all 0.3s ease;
    }

    .card:hover .arrow-icon {
      stroke: var(--accent-color);
      transform: translateX(4px);
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem;
      }

      h1 {
        font-size: 2rem;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <h1>Sitemap Matrix</h1>
      <p class="subtitle">Quick access to available poster modules</p>
    </header>

    <div class="grid">
      <a href="contra.html" class="card">
        <div class="card-header">
          <h2 class="card-title">Contra Interface</h2>
          <svg class="arrow-icon" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
        <div class="card-desc">
          View the detailed layout and design specifications for the Contra poster component.
        </div>
      </a>

      <a href="linkedin-cover.html" class="card">
        <div class="card-header">
          <h2 class="card-title">LinkedIn Cover</h2>
          <svg class="arrow-icon" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </div>
        <div class="card-desc">
          Explore the professional header design formatting and aesthetic elements for LinkedIn.
        </div>
      </a>
    </div>
  </div>

</body>

</html>
